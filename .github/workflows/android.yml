name: Android CI & Build Outputs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradle Wrapper
      run: chmod +x gradlew || true

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Determine App Version
      id: get_version
      run: |
        VERSION_NAME=$(grep -oE "versionName\s*=\s*\"[^\"]+\"" app/build.gradle.kts | cut -d'"' -f2)
        if [ -z "$VERSION_NAME" ]; then
          VERSION_NAME="1.0"
        fi
        echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Found version: $VERSION_NAME"

    - name: Prepare Build Outputs Folder
      run: |
        VERSION_NAME="${{ steps.get_version.outputs.version }}"
        mkdir -p build-outputs/$VERSION_NAME
        cp app/build/outputs/apk/debug/app-debug.apk build-outputs/$VERSION_NAME/MineMods-$VERSION_NAME.apk
        echo "Successfully copied MineMods-$VERSION_NAME.apk to build-outputs/$VERSION_NAME/"

    - name: Commit and Push built APK to GitHub
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add build-outputs/
        git diff-index --quiet HEAD || (git commit -m "Automated build: MineMods ${{ steps.get_version.outputs.version }}" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
